# Render Blueprint Specification for Mandate Control Plane
# Architecture:
# - Web Service: FastAPI Control Plane API (Public) + Embedded Reconciliation Loop
# - Managed PostgreSQL: System of record for mandates, agents, operations, and audit logs
# - Key Value (Redis/Valkey): Distributed rate limiting & concurrency state
#
# Note: Render's Free tier supports Web Services, Managed PostgreSQL, and Key Value.
# Background Workers require a paid Starter plan ($7/mo). To maintain zero cost on the
# free tier, the background reconciliation loop is safely embedded in the Web Service lifespan.

services:
  # 1. FastAPI Control Plane Web Service
  - type: web
    name: mandate-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: demo
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: AUTO_MIGRATE_ON_STARTUP
        value: "true"
      - key: AUTO_SEED_DEMO
        value: "true"
      - key: RAZORPAY_MOCK_MODE
        value: "true"
      - key: RAZORPAY_KEY_ID
        value: rzp_test_placeholder
      - key: RAZORPAY_KEY_SECRET
        generateValue: true
      - key: RAZORPAY_WEBHOOK_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        # Update with your Vercel deployment URL (e.g. https://mandate-web.vercel.app)
        value: http://localhost:3000
      - key: DATABASE_URL
        fromDatabase:
          name: mandate-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mandate-redis
          property: connectionString

  # 2. Managed Key Value (Redis/Valkey-compatible)
  - type: keyvalue
    name: mandate-redis
    region: oregon
    plan: free
    ipAllowList: [] # internal access only

databases:
  # 3. Managed PostgreSQL Database
  - name: mandate-postgres
    region: oregon
    plan: free
    databaseName: mandate_db
    user: mandate_user
